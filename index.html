<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Just Drive Games</title>
<meta name="theme-color" content="#0047BB">
<meta name="description" content="Two-minute games that teach kids to put the phone down. In memory of Mitchel Kiefer.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Just Drive">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --royal:#0047BB; --bright:#307FE2; --peri:#5C88DA; --red:#DA291C; --dark:#002B70; --deep:#001F52; --tint:#B9CDF2; --green:#1E9E55;
  --bg:#EEF3FB; --ink:#002B70; --card:#FFFFFF; --muted:#3D5A8A; --rule:#C9D6EC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#001F52;--ink:#EEF4FB;--card:#00358C;--muted:#B9CDF2;--rule:#1E5BC6;}
}
:root[data-theme="dark"]{--bg:#001F52;--ink:#EEF4FB;--card:#00358C;--muted:#B9CDF2;--rule:#1E5BC6;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Gotham','Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:560px;margin:0 auto;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--bright);outline-offset:3px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;background:var(--bright);color:#fff;border:0;border-radius:12px;padding:15px 18px;font-weight:800;font-size:1.05rem}
.btn.ghost{background:transparent;color:inherit;border:2px solid currentColor;opacity:.9}
.btn:disabled{opacity:.45;cursor:not-allowed}
p{line-height:1.5;margin:0 0 12px}

/* Hub */
#hub{overflow-y:auto}
.hero{background:var(--royal);color:#fff;padding:26px 22px 24px}
.hero-top{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.hero img{width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:center 22%;border:4px solid #fff;flex:none}
.hero h1{margin:0;font-size:2rem;font-weight:900;line-height:1}
.hero .mem{color:var(--tint);font-weight:700;font-size:.95rem;margin-top:6px}
.hero p{color:#E3ECFA;margin:0;font-weight:500}
.dash{display:block;height:5px;width:52px;margin:16px 0 0;background:repeating-linear-gradient(90deg,#fff 0 10px,transparent 10px 16px)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:18px}
.gcard{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:150px;text-decoration:none;color:var(--ink)}
.gcard .ic{width:44px;height:44px;border-radius:12px;background:var(--royal);color:#fff;display:grid;place-items:center}
.gcard .ic svg{width:26px;height:26px}
.gcard b{font-weight:800;font-size:1.02rem;line-height:1.15}
.gcard span{font-size:.86rem;color:var(--muted);line-height:1.35}
.gcard.tribute .ic{background:var(--red)}
.foot{padding:4px 22px 30px;text-align:center}
.foot b{display:block;font-size:1.15rem;font-weight:900;margin-bottom:6px}
.foot a{color:var(--bright);font-weight:800}

/* Play */
#play{background:var(--deep);color:#fff}
.bar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--dark)}
.back{background:transparent;border:2px solid #3A6FD0;border-radius:10px;padding:7px 12px;font-weight:700;font-size:.9rem}
#gTitle{font-weight:900;flex:1;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gScore{font-weight:800;color:var(--tint);font-size:.9rem;white-space:nowrap}
#stage{position:relative;flex:1;overflow:hidden}
.cv{display:block;width:100%;height:100%;touch-action:none}
.over{position:absolute;inset:0;background:rgba(0,31,82,.88);display:flex;align-items:center;justify-content:center;padding:22px;z-index:20}
.over[hidden]{display:none}
.panel{background:#fff;color:var(--dark);border-radius:20px;padding:24px 22px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.panel h2{margin:0 0 12px;font-size:1.7rem;font-weight:900;line-height:1.05}
.panel .ln{font-weight:700;font-size:1.05rem;margin-bottom:6px}
.panel .fact{background:#EEF3FB;border-radius:12px;padding:12px 14px;margin:14px 0 16px;line-height:1.45;font-weight:500}
.panel .stack{display:flex;flex-direction:column;gap:10px}
.panel .btn.ghost{color:var(--dark)}

/* DOM game shared */
.pad{position:absolute;inset:0;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;color:var(--dark);border-radius:16px;padding:16px}
.big{font-size:1.35rem;font-weight:900;line-height:1.2}
.choice{background:#fff;color:var(--dark);border:2px solid #fff;border-radius:14px;padding:14px;text-align:left;font-weight:700;line-height:1.35;width:100%}
.choice.good{border-color:var(--green);background:#E5F6EC}
.choice.bad{border-color:var(--red);background:#FCE9E7}
.choice.ok{border-color:#E2A000;background:#FFF5DB}
.fb{border-radius:12px;padding:12px 14px;font-weight:600;line-height:1.4;background:#00358C}
.muted{color:var(--tint)}
.timer{height:8px;background:#00358C;border-radius:4px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--bright);transform-origin:left}

/* Reaction */
.road{position:relative;height:230px;border-radius:18px;background:repeating-linear-gradient(180deg,#3A3E45 0 40px,#3A3E45 40px 80px);overflow:hidden;border:4px solid transparent;transition:border-color .1s}
.road::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:repeating-linear-gradient(180deg,#F4F6F8 0 30px,transparent 30px 60px)}
.rear{position:absolute;left:50%;bottom:24px;width:150px;height:96px;margin-left:-75px;border-radius:22px 22px 14px 14px;background:linear-gradient(180deg,#5C88DA,#0047BB)}
.rear::before{content:"";position:absolute;left:18px;right:18px;top:12px;height:30px;border-radius:10px;background:#1A2C44}
.tl{position:absolute;bottom:18px;width:34px;height:16px;border-radius:5px;background:#5A1410}
.tl.l{left:12px}.tl.r{right:12px}
.road.on{border-color:var(--red)}
.road.on .tl{background:#FF3B2E;box-shadow:0 0 22px 8px rgba(255,59,46,.75)}
.rmsg{position:absolute;left:12px;right:12px;top:12px;text-align:center;font-weight:800;font-size:1.05rem;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.brake{background:var(--red);font-size:1.3rem;padding:20px}
.phonebox{background:#FAFCFF;color:var(--dark);border-radius:20px;padding:14px;box-shadow:0 0 0 6px #0A0F18}
.bub{background:#E3EAF3;border-radius:16px 16px 16px 4px;padding:9px 12px;display:inline-block;margin:6px 0 10px;font-weight:600}
.typed{min-height:24px;font-weight:700;color:var(--royal);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:var(--bright);color:#fff;border:0;border-radius:999px;padding:9px 14px;font-weight:700}

/* DND */
.phonegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:#0A0F18;border-radius:28px;padding:18px 14px}
.tile{aspect-ratio:1;border:0;border-radius:18px;background:#1E2A3D;color:#fff;font-weight:800;font-size:.82rem;line-height:1.15;padding:6px;display:flex;align-items:center;justify-content:center;text-align:center}
.tile.task{background:var(--royal)}
.tile.dist{background:#3A3E45}
.tile.hit{background:var(--green)}
.tile.miss{background:var(--red)}

/* Spot */
.spotgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.drv{position:relative;aspect-ratio:1;border-radius:16px;border:3px solid transparent;background:linear-gradient(180deg,#B9CDF2 0 62%,#3A3E45 62%);overflow:hidden;padding:0}
.drv .face{position:absolute;left:50%;top:18%;width:46%;aspect-ratio:1;margin-left:-23%;border-radius:50%}
.drv .eye{position:absolute;width:12%;height:12%;border-radius:50%;background:#1A1A1A;top:38%}
.drv .eye.l{left:26%}.drv .eye.r{right:26%}
.drv.down .eye{top:62%}
.drv .wheel{position:absolute;left:22%;right:22%;bottom:6%;height:24%;border:5px solid #111;border-bottom:0;border-radius:60px 60px 0 0}
.drv .prop{position:absolute;right:8%;bottom:6%;font-size:1.7rem;line-height:1}
.drv.found{border-color:var(--green)}
.drv.found::after{content:"";position:absolute;inset:0;background:rgba(30,158,85,.35)}
.drv.wrong{border-color:var(--red);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Streak */
.mini-road{height:120px;border-radius:16px;position:relative;overflow:hidden;background:#3A3E45}
.mini-road::before{content:"";position:absolute;left:50%;top:-60px;bottom:-60px;width:6px;margin-left:-3px;background:repeating-linear-gradient(180deg,#F4F6F8 0 30px,transparent 30px 60px);animation:roll .6s linear infinite}
@keyframes roll{to{transform:translateY(60px)}}
.mini-road .car{position:absolute;left:50%;bottom:14px;width:34px;height:60px;margin-left:-17px;border-radius:10px;background:var(--bright)}
.notif{background:#FAFCFF;color:var(--dark);border-radius:16px;padding:12px 14px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.notif .from{font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row button{flex:1 1 auto;border:0;border-radius:10px;padding:11px 10px;font-weight:800}
.b-open{background:#3A3E45;color:#fff}
.b-ign{background:var(--bright);color:#fff}
.b-pull{background:var(--green);color:#fff}
.days{display:flex;gap:6px}
.days i{flex:1;height:12px;border-radius:6px;background:#00358C}
.days i.ok{background:var(--green)}.days i.no{background:var(--red)}
.streakbig{font-size:3rem;font-weight:900;line-height:1}

/* Eyes Up */
.cv{transition:filter .18s}
.cv.blind{filter:blur(9px) brightness(.4) saturate(.6)}
.eu-notif{position:absolute;left:12px;right:12px;top:12px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;text-align:left;background:rgba(250,252,255,.97);color:#002B70;border:0;border-radius:18px;padding:12px 14px;box-shadow:0 10px 28px rgba(0,0,0,.4)}
.eu-notif[hidden]{display:none}
.eu-notif .icon{grid-row:span 3;width:40px;height:40px;border-radius:11px;color:#fff;display:grid;place-items:center;font-weight:900}
.eu-notif .from{font-weight:800}.eu-notif .text{font-size:.95rem}.eu-notif .hint{font-size:.78rem;color:#3D5A8A}
.eu-notif .bar{grid-column:1/-1;height:3px;background:#DDE6F1;border-radius:2px;overflow:hidden;margin-top:6px}
.eu-notif .bar i{display:block;height:100%;background:var(--bright);transform-origin:left}
.eu-phone{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none}
.eu-phone[hidden]{display:none}
.eu-phone .eyes{background:var(--red);color:#fff;font-weight:800;padding:8px 16px;border-radius:999px;display:flex;gap:10px;align-items:baseline}
.eu-phone .eyes strong{font-size:1.3rem;font-variant-numeric:tabular-nums}
.eu-phone .device{pointer-events:auto;width:min(78%,290px);background:#FAFCFF;color:#002B70;border-radius:32px;padding:18px 16px 20px;box-shadow:0 0 0 8px #0A0F18,0 24px 60px rgba(0,0,0,.65)}
.eu-phone .dhead{text-align:center;font-weight:800;font-size:.85rem;color:#3D5A8A;margin-bottom:14px}
.eu-phone .who{font-weight:800;margin-bottom:6px}
.eu-phone .bubble{background:#E3EAF3;border-radius:18px 18px 18px 4px;padding:10px 14px;margin-bottom:18px;line-height:1.35}
.eu-phone .replies{display:flex;flex-wrap:wrap;gap:8px}
.eu-phone .replies button{flex:1 1 auto;background:var(--bright);color:#fff;border:0;border-radius:999px;padding:10px 12px;font-weight:700}
.eu-toast{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);background:var(--red);color:#fff;font-weight:800;padding:10px 16px;border-radius:10px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.eu-toast.on{opacity:1}
.eu-count{position:absolute;inset:0;display:grid;place-items:center;font-size:6rem;font-weight:900;color:#fff;text-shadow:0 5px 0 var(--bright);pointer-events:none}
/* Pledge */
.pl-field{display:block;font-weight:700}
.pl-field input{display:block;width:100%;margin-top:6px;font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:10px;border:2px solid #1E5BC6;background:#fff;color:#002B70}
.pl-check{display:flex;gap:12px;align-items:flex-start;background:#00358C;border-radius:12px;padding:14px;line-height:1.4;cursor:pointer}
.pl-check input{width:22px;height:22px;accent-color:var(--bright);flex:none;margin-top:1px}
.cert{background:#0047BB;border:3px solid #fff;color:#fff;border-radius:18px;padding:30px 22px 26px;text-align:center}
.cert .tag{display:inline-block;border:3px solid #fff;border-radius:10px;padding:8px 14px 5px;font-weight:900;font-size:1.3rem;margin-bottom:20px}
.cert .name{font-size:2rem;font-weight:900;line-height:1.1;margin:4px 0 8px}
.cert .for{color:var(--tint);font-weight:700;margin:0}
.hero-actions{display:flex;gap:10px;margin-top:18px}
.hero-actions .btn{padding:12px 10px;font-size:.95rem}
.hero-actions .btn.ghost{color:#fff}
.share-note{color:var(--tint);font-weight:600;font-size:.88rem;min-height:1.2em;margin-top:8px}
@media (prefers-reduced-motion:reduce){.mini-road::before{animation:none}.drv.wrong{animation:none}}
</style>
</head>
<body>
<div id="app">
  <section class="screen on" id="hub">
    <header class="hero">
      <div class="hero-top">
        <img src="mitchel.jpg" alt="Mitchel Kiefer smiling in his blue hockey jersey">
        <div><h1>Just Drive Games</h1><div class="mem">In memory of Mitchel Kiefer</div></div>
      </div>
      <p>Two-minute games that teach kids to put the phone down. Pick one and play.</p>
      <div class="hero-actions"><button class="btn" id="shareApp">Share this app</button><button class="btn ghost" id="openPledge">Take the pledge</button></div>
      <div class="share-note" id="shareNote"></div>
    </header>
    <div class="grid" id="grid"></div>
    <div class="foot"><b>Put your phone down. Just drive.</b><a href="https://mkiefer.org" target="_blank" rel="noopener">mkiefer.org</a></div>
  </section>

  <section class="screen" id="play">
    <div class="bar">
      <button class="back" id="back">All games</button>
      <div id="gTitle"></div>
      <div id="gScore"></div>
    </div>
    <div id="stage"></div>
    <div class="over" id="over" hidden>
      <div class="panel">
        <h2 id="oTitle"></h2>
        <div id="oLines"></div>
        <div class="fact" id="oFact"></div>
        <div class="stack">
          <button class="btn" id="oAgain">Play again</button>
          <button class="btn ghost" id="oHub">All games</button>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FT_PER_SEC = 80.67; // 55 mph
const APP_URL = 'https://claude.ai/artifact/F4u2p7TDTDCjoReFp7Qi5K';

function show(id){ document.querySelectorAll('.screen').forEach(el => el.classList.toggle('on', el.id === id)); }

let cleanups = [], current = null;
function runCleanups(){ cleanups.forEach(f => { try { f(); } catch (e) {} }); cleanups = []; }
function makeApi(stage){
  return {
    stage,
    score: t => { $('#gScore').textContent = t; },
    end: r => showOver(r),
    clean: f => cleanups.push(f),
    on: (el, ev, fn, opt) => { el.addEventListener(ev, fn, opt); cleanups.push(() => el.removeEventListener(ev, fn, opt)); },
    later: (fn, ms) => { const id = setTimeout(fn, ms); cleanups.push(() => clearTimeout(id)); return id; }
  };
}
function openGame(g){
  runCleanups(); current = g;
  show('play'); $('#gTitle').textContent = g.title; $('#gScore').textContent = '';
  $('#over').hidden = true;
  const st = $('#stage'); st.innerHTML = '';
  requestAnimationFrame(() => g.start(makeApi(st)));
}
function showOver(r){
  $('#oTitle').textContent = r.title;
  $('#oLines').innerHTML = (r.lines || []).map(l => `<div class="ln">${esc(l)}</div>`).join('');
  $('#oFact').textContent = r.fact || '';
  $('#over').hidden = false;
  $('#oAgain').focus();
}
$('#back').addEventListener('click', () => { runCleanups(); show('hub'); });
$('#oHub').addEventListener('click', () => { runCleanups(); show('hub'); });
$('#oAgain').addEventListener('click', () => openGame(current));

function makeCanvas(stage){
  const cv = document.createElement('canvas'); cv.className = 'cv'; stage.appendChild(cv);
  const ctx = cv.getContext('2d'); const o = {cv, ctx, W:0, H:0};
  o.fit = () => { const r = stage.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2); o.W = r.width; o.H = r.height; cv.width = o.W * d; cv.height = o.H * d; ctx.setTransform(d,0,0,d,0,0); };
  o.fit(); return o;
}
function loop(fn){
  let last = performance.now(), alive = true, id;
  const f = t => { if (!alive) return; const dt = Math.min((t - last) / 1000, .05); last = t; fn(dt); id = requestAnimationFrame(f); };
  id = requestAnimationFrame(f);
  return () => { alive = false; cancelAnimationFrame(id); };
}
function rr(ctx,x,y,w,h,r){ r = Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function dot(ctx,x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }

/* ---------------- 1. Goalie Save ---------------- */
const goalie = {
  id:'goalie', title:'Goalie Save', tribute:true,
  blurb:'Play goalie like Mitchel. Block distractions before they reach the driver.',
  icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3l7 13c.6 1.2 1.6 2 3 2h4"/><ellipse cx="7" cy="19" rx="3.5" ry="1.6"/></svg>',
  start(a){
    const C = makeCanvas(a.stage), ctx = C.ctx;
    const LABELS = [['TXT','#307FE2'],['SNAP','#E2A000'],['LIKE','#DA291C'],['GAME','#7B5CE0'],['DM','#1E9E55'],['LIVE','#E2630F']];
    let gx = C.W/2, pucks = [], t = 0, saves = 0, goals = 0, spawn = 1, flash = 0, done = false, pops = [];
    const keys = {};
    a.on(C.cv,'pointerdown', e => { gx = e.offsetX; });
    a.on(C.cv,'pointermove', e => { if (e.buttons || e.pointerType === 'mouse') gx = e.offsetX; });
    a.on(window,'keydown', e => { keys[e.key] = 1; });
    a.on(window,'keyup', e => { keys[e.key] = 0; });
    a.on(window,'resize', () => C.fit());
    a.clean(loop(dt => {
      if (done) return;
      const W = C.W, H = C.H, netW = Math.min(W*.62, 300), netX = (W - netW)/2, gw = Math.max(84, netW*.36), gy = H - 140;
      t += dt;
      if (keys.ArrowLeft || keys.a) gx -= 560*dt; if (keys.ArrowRight || keys.d) gx += 560*dt;
      gx = Math.max(gw/2, Math.min(W - gw/2, gx));
      spawn -= dt;
      if (spawn <= 0){
        const L = pick(LABELS), sx = rand(24, W - 24), tx = rand(netX + 18, netX + netW - 18), ty = H - 30;
        const sp = H * (.3 + t * .009), dx = tx - sx, dy = ty + 30, len = Math.hypot(dx, dy);
        pucks.push({x:sx, y:-30, vx:dx/len*sp, vy:dy/len*sp, L});
        spawn = Math.max(.42, 1.25 - t * .02);
      }
      for (const p of pucks){
        p.x += p.vx*dt; p.y += p.vy*dt;
        if (!p.dead && p.y + 20 > gy && p.y - 20 < gy + 24 && p.x > gx - gw/2 - 16 && p.x < gx + gw/2 + 16){ p.dead = 1; saves++; pops.push({x:p.x, y:gy - 10, t:.6, txt:'Save!'}); }

      if (player){ ctx.fillStyle = '#fff'; for (let i = 0; i < 3; i++){ rr(ctx, cx - w*.05, y + h*.04 + i*h*.055, w*.1, h*.035, 2); ctx.fill(); } }
      ctx.restore();
    }
    function drawObstacle(o){
      const cx = laneCenter(o.lane), y = o.y, w = o.w, h = o.h;
      if (o.type === 'car') return drawCar(cx, y, w, h, o.color, false);
      ctx.save();
      if (o.type === 'bike'){
        ctx.fillStyle = '#16181C'; rr(ctx, cx - 3.5, y, 7, h*.3, 3.5); ctx.fill(); rr(ctx, cx - 3.5, y + h*.7, 7, h*.3, 3.5); ctx.fill();
        ctx.fillStyle = '#9AA3AE'; ctx.fillRect(cx - 1.5, y + h*.2, 3, h*.6); ctx.fillRect(cx - w*.5, y + h*.2, w, 3);
        ctx.fillStyle = '#DA291C'; rr(ctx, cx - w*.38, y + h*.5, w*.76, h*.26, 5); ctx.fill();
        ctx.fillStyle = '#F2A33A'; dot(ctx, cx, y + h*.4, w*.4); ctx.fillStyle = '#fff'; ctx.fillRect(cx - 1.5, y + h*.4 - w*.38, 3, w*.76);
      } else if (o.type === 'deer'){
        const d = o.dir;
        ctx.fillStyle = '#93602F'; ctx.beginPath(); ctx.ellipse(cx, y + h/2, w*.4, h*.42, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#F4EBDD'; dot(ctx, cx - d*w*.4, y + h*.5, h*.13);
        ctx.fillStyle = '#8B5A2B'; ctx.beginPath(); ctx.ellipse(cx + d*w*.42, y + h*.42, h*.3, h*.24, 0, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#E8D9BE'; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.beginPath();
        ctx.moveTo(cx + d*w*.38, y + h*.25); ctx.lineTo(cx + d*w*.3, y - h*.18); ctx.moveTo(cx + d*w*.48, y + h*.25); ctx.lineTo(cx + d*w*.6, y - h*.12); ctx.stroke();
      } else {
        ctx.fillStyle = '#2B2F36'; rr(ctx, cx - w/2, y, w, h, 3); ctx.fill();
        ctx.fillStyle = '#F47B20'; dot(ctx, cx, y + h/2, w*.42); ctx.fillStyle = '#fff'; dot(ctx, cx, y + h/2, w*.26); ctx.fillStyle = '#F47B20'; dot(ctx, cx, y + h/2, w*.14);
      }
      ctx.restore();
    }
    function drawScenery(o){
      ctx.textAlign = 'center';
      if (o.kind === 'tree' || o.kind === 'bush'){
        const r = o.kind === 'bush' ? o.r*.6 : o.r;
        ctx.fillStyle = 'rgba(0,0,0,.25)'; dot(ctx, o.x + r*.35, o.y + r*.4, r);
        ctx.fillStyle = o.hue < .2 ? '#5E9E3F' : '#2F6B2A'; dot(ctx, o.x, o.y, r);
        ctx.fillStyle = 'rgba(255,255,255,.1)'; dot(ctx, o.x - r*.3, o.y - r*.3, r*.35);
      } else if (o.kind === 'limit'){
        ctx.fillStyle = '#7D8794'; ctx.fillRect(o.x - 1.5, o.y, 3, 24);
        ctx.fillStyle = '#FFF'; rr(ctx, o.x - 12, o.y - 16, 24, 30, 3); ctx.fill();
        ctx.fillStyle = '#16181C'; ctx.font = '900 12px Montserrat, sans-serif'; ctx.fillText('55', o.x, o.y + 7);
      } else if (o.kind === 'warn'){
        ctx.fillStyle = '#7D8794'; ctx.fillRect(o.x - 1.5, o.y, 3, 24);
        ctx.save(); ctx.translate(o.x, o.y - 4); ctx.rotate(Math.PI/4); ctx.fillStyle = '#FFC72C'; rr(ctx, -11, -11, 22, 22, 3); ctx.fill(); ctx.restore();
        ctx.fillStyle = '#16181C'; ctx.font = '900 13px Montserrat, sans-serif'; ctx.fillText('!', o.x, o.y + 1);
      } else if (o.kind === 'guide'){
        const sw = Math.min(roadX - 10, 54); if (sw < 34) return;
        const sx = o.left ? 4 + sw/2 : W - 4 - sw/2;
        ctx.fillStyle = '#0047BB'; rr(ctx, sx - sw/2, o.y - 24, sw, 26, 4); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = '900 8px Montserrat, sans-serif'; ctx.fillText('JUST', sx, o.y - 13); ctx.fillText('DRIVE', sx, o.y - 4.5);
      }
    }
    function draw(){
      ctx.save();
      if (s.shake > 0 && !reduce) ctx.translate((Math.random() - .5)*14*s.shake/.45, (Math.random() - .5)*9*s.shake/.45);
      const off = s.scroll % 128;
      ctx.save(); ctx.translate(0, off); ctx.fillStyle = grassPat; ctx.fillRect(-20, -150, W + 40, H + 300); ctx.restore();
      ctx.fillStyle = '#9C988A'; ctx.fillRect(roadX - 12, -20, roadW + 24, H + 40);
      ctx.save(); ctx.beginPath(); ctx.rect(roadX, -20, roadW, H + 40); ctx.clip(); ctx.translate(0, off); ctx.fillStyle = roadPat; ctx.fillRect(roadX, -150, roadW, H + 300); ctx.restore();
      ctx.fillStyle = '#F4F6F8'; ctx.fillRect(roadX + 9, -20, 4, H + 40);
      ctx.fillStyle = '#FFC72C'; ctx.fillRect(roadX + roadW - 13, -20, 4, H + 40);
      const period = H*.15, dl = H*.075, d = s.scroll % period;
      ctx.fillStyle = '#F4F6F8';
      for (let i = 1; i < 3; i++){ const x = roadX + laneW*i - 2; for (let y = -period + d; y < H; y += period) ctx.fillRect(x, y, 4, dl); }
      s.scen.forEach(drawScenery); s.obs.forEach(drawObstacle);
      const P = playerBox(); drawCar(s.px, P.y, P.w, P.h, '#307FE2', true);
      if (s.flash > 0){ ctx.fillStyle = `rgba(218,41,28,${s.flash*.75})`; ctx.fillRect(-20, -20, W + 40, H + 40); }
      ctx.restore();
    }
    let stopLoop = null;
    function finish(){
      if (!s.running) return; s.running = false; if (stopLoop) stopLoop();
      if (s.phone) closePhone(0); hideNotif();
      const sec = s.lookAway, feet = Math.round(sec*FT_PER_SEC), made = s.lives > 0;
      const uniq = [...new Set(s.hits)].map(t => HIT_NAME[t]);
      a.later(() => a.end({
        title: !made ? 'Crash. Your drive is over.' : sec < .5 ? 'Eyes up the whole way!' : 'You made it home. This time.',
        lines: [sec < .5 ? '0 feet driven without looking.' : `${feet.toLocaleString()} feet driven blind. That's ${(feet/360).toFixed(1)} football fields at 55 mph.`, `${s.opens} texts opened, ${s.ignored} ignored`].concat(uniq.length ? [`What you didn't see: ${uniq.join(', ')}.`] : []),
        fact: 'Mitchel Kiefer was 18 when a distracted driver took his life. The text can wait. Just drive.'
      }), made ? 200 : 700);
    }
    a.on(canvas, 'pointerdown', e => { if (!s.running) return; const x = e.clientX - canvas.getBoundingClientRect().left; s.lane = Math.max(0, Math.min(2, s.lane + (x < s.px ? -1 : 1))); });
    a.on(window, 'keydown', e => {
      if (!s.running) return;
      if (['ArrowLeft','a','A'].includes(e.key)){ s.lane = Math.max(0, s.lane - 1); e.preventDefault(); }
      else if (['ArrowRight','d','D'].includes(e.key)){ s.lane = Math.min(2, s.lane + 1); e.preventDefault(); }
      else if ((e.key === ' ' || e.key === 'Enter') && s.notif){ openPhone(); e.preventDefault(); }
      else if (s.phone && ['1','2','3'].includes(e.key)){ const b = $('#euReplies').children[+e.key - 1]; if (b) b.click(); }
    });
    a.on($('#euNotif'), 'pointerdown', e => e.stopPropagation());
    a.on($('#euNotif'), 'click', e => { e.stopPropagation(); openPhone(); });
    resize(); for (let i = 0; i < 10; i++) addScenery(Math.random()*H); hud(); draw();
    const c = $('#euCount'); let n = 3; c.textContent = n;
    const tick = () => { n--; if (n > 0){ c.textContent = n; a.later(tick, 700); } else if (n === 0){ c.textContent = 'Go'; a.later(tick, 500); } else { c.remove(); s.running = true; stopLoop = loop(dt => { if (!s.running) return; update(dt); if (s.running) draw(); }); a.clean(stopLoop); } };
    a.later(tick, 700);
  }
};

/* ---------------- Pledge ---------------- */
const pledge = {
  id:'pledge', title:'Just Drive Pledge',
  start(a){
    a.stage.innerHTML = `<div class="pad">
      <div class="big">My Just Drive pledge</div>
      <label class="pl-field">Your first name<input id="plName" autocomplete="given-name" maxlength="30"></label>
      <label class="pl-check"><input type="checkbox" class="pc"> I'll put my phone away before the car moves.</label>
      <label class="pl-check"><input type="checkbox" class="pc"> I'll speak up when a driver is distracted.</label>
      <label class="pl-check"><input type="checkbox" class="pc"> I'll help whoever is driving stay focused.</label>
      <button class="btn" id="plSign" disabled>Sign my pledge</button>
    </div>`;
    const check = () => { $('#plSign').disabled = !($('#plName').value.trim() && [...document.querySelectorAll('.pc')].every(c => c.checked)); };
    $('#plName').oninput = check; document.querySelectorAll('.pc').forEach(c => c.onchange = check);
    $('#plSign').onclick = () => {
      const name = $('#plName').value.trim(), date = new Date().toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'});
      a.stage.innerHTML = `<div class="pad"><div class="cert"><div class="tag">JUST DRIVE</div><div class="name">${esc(name)}</div><p>signed the Just Drive pledge on ${esc(date)}.</p><p class="for">In honor of Mitchel Kiefer</p></div>
        <button class="btn" id="plShare">Send it to my parents</button><p class="muted" id="plNote" style="text-align:center;min-height:1.3em"></p></div>`;
      $('#plShare').onclick = async () => {
        const text = `${name} took the Just Drive pledge in honor of Mitchel Kiefer: phone away before the car moves, speak up when a driver is distracted, and help whoever is driving stay focused. Play the games: ${APP_URL}`;
        try { if (navigator.share){ await navigator.share({title:'Just Drive pledge', text}); $('#plNote').textContent = 'Sent.'; } else { await navigator.clipboard.writeText(text); $('#plNote').textContent = 'Copied. Paste it into a text to your parents.'; } }
        catch (e) { $('#plNote').textContent = 'Sharing was cancelled.'; }
      };
    };
  }
};

const GAMES = [eyesup, goalie, aces, reaction, dnd, speak, spot, streak, quiz];
const grid = $('#grid');
GAMES.forEach(g => {
  const b = document.createElement('button'); b.className = 'gcard' + (g.tribute ? ' tribute' : '');
  b.innerHTML = `<div class="ic">${g.icon}</div><b>${esc(g.title)}</b><span>${esc(g.blurb)}</span>`;
  b.onclick = () => openGame(g);
  grid.appendChild(b);
});

$('#openPledge').addEventListener('click', () => openGame(pledge));
$('#shareApp').addEventListener('click', async () => {
  const data = {title:'Just Drive Games', text:'Two-minute games that teach kids to put the phone down. In memory of Mitchel Kiefer.', url: APP_URL};
  try {
    if (navigator.share){ await navigator.share(data); $('#shareNote').textContent = 'Thanks for sharing.'; }
    else { await navigator.clipboard.writeText(`${data.text} ${APP_URL}`); $('#shareNote').textContent = 'Link copied. Paste it anywhere.'; }
  } catch (e) { $('#shareNote').textContent = 'Sharing was cancelled.'; }
});
